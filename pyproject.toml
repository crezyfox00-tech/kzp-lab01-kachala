[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kzp-data-report"
version = "0.1.0"
description = "CSV data report for Plant Nursery (Variant 12)"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "build>=1.2",
]

[project.scripts]
kzp-report = "kzp_lab06.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
exclude = ["build", "dist", ".venv", ".venv-*"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]